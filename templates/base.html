<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cuadrador{% endblock %}</title>
  <style>
    /* Colores solo donde significan algo: verde cuadra, rojo no cuadra, ámbar revisar */
    :root {
      --ink: #111827; --muted: #4b5563; --faint: #6b7280;
      --line: #d1d5db; --line-soft: #e5e7eb;
      --page: #f4f5f7; --surface: #ffffff; --head: #f9fafb;
      --accent: #1f3a5f; --accent-hover: #162b47;
      --good: #166534; --good-bg: #dcfce7; --good-line: #86efac;
      --bad: #991b1b;  --bad-bg: #fee2e2;  --bad-line: #fca5a5;
      --warn: #92400e; --warn-bg: #fef3c7; --warn-line: #fcd34d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink);
           font: 15px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .topbar { background: var(--accent); color: #fff; }
    .topbar .inner { max-width: 1120px; margin: 0 auto; padding: 12px 20px; display: flex;
                     align-items: center; justify-content: space-between; gap: 16px; }
    .brand { color: #fff; text-decoration: none; font-weight: 700; font-size: 1.05rem; letter-spacing: .02em; }
    .brand span { font-weight: 400; opacity: .8; margin-left: 8px; }
    .topbar nav a { color: #fff; opacity: .9; text-decoration: none; font-size: .9rem; }
    main { max-width: 1120px; margin: 0 auto; padding: 28px 20px 64px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -.01em; }
    h2 { font-size: 1.15rem; margin: 36px 0 10px; }
    h3 { font-size: .95rem; margin: 22px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); }
    .small { font-size: .85rem; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 22px; }

    /* Botones */
    .button, button { display: inline-block; font: inherit; font-weight: 600; border-radius: 6px; cursor: pointer;
                      padding: 9px 16px; border: 1px solid var(--accent); background: var(--accent); color: #fff;
                      text-decoration: none; }
    .button:hover, button:hover { background: var(--accent-hover); }
    .button.secondary, button.secondary { background: var(--surface); color: var(--accent); }
    .button.secondary:hover, button.secondary:hover { background: var(--head); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

    /* Formularios */
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input[type=text], select { font: inherit; padding: 8px 10px; border: 1px solid var(--line);
                               border-radius: 6px; width: 100%; max-width: 360px; background: #fff; }
    input[type=file] { font: inherit; }
    .hint { color: var(--muted); font-size: .85rem; margin-top: 4px; }
    fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 20px; }
    legend { font-weight: 700; padding: 0 6px; }

    /* Mensajes */
    .alert { border: 1px solid; border-radius: 8px; padding: 12px 16px; margin: 16px 0; }
    .alert.error { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); }

    /* Tablas */
    .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
    th { background: var(--head); font-weight: 600; color: var(--muted); font-size: .8rem;
         text-transform: uppercase; letter-spacing: .03em; }
    tr:last-child td { border-bottom: 0; }
    .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .nowrap { white-space: nowrap; }
    .sub { color: var(--muted); font-size: .85rem; }

    /* Etiquetas de estado */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .75rem; font-weight: 700;
             border: 1px solid; white-space: nowrap; }
    .badge.Review, .badge.Probable { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-line); }
    .badge.Probable { background: #fff; }
    .badge.Matched { background: var(--good-bg); color: var(--good); border-color: var(--good-line); }
    .badge.pending { background: #fff; color: var(--warn); border-color: var(--warn-line); }

    details > summary { cursor: pointer; font-weight: 700; font-size: 1.15rem; margin: 36px 0 10px; }
    .footer-note { margin-top: 48px; color: var(--faint); font-size: .85rem; }

    @media (max-width: 720px) {
      .topbar nav { display: none; }
      main { padding: 20px 14px 48px; }
    }

    /* Impresión: sin botones ni barra, todo desplegado, blanco y negro legible */
    @media print {
      body { background: #fff; font-size: 11pt; }
      .topbar, .no-print, form, .actions { display: none !important; }
      main { padding: 0; max-width: none; }
      .card, .table-wrap { border-color: #999; }
      tr { break-inside: avoid; }
      h2, h3 { break-after: avoid; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="inner">
      <a class="brand" href="{{ url_for('upload_form') }}">Cuadrador<span>Bank reconciliation</span></a>
      <nav><a href="{{ url_for('upload_form') }}">New reconciliation</a></nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
    <p class="footer-note">Runs on this computer only. Files are processed in memory and never stored.</p>
  </main>
  <script>
    // Al imprimir, abrir todas las secciones plegadas para que salgan en papel
    window.addEventListener("beforeprint", () => document.querySelectorAll("details").forEach(d => d.open = true));
  </script>
</body>
</html>
