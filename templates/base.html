<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cuadrador{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #1d2330; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    h2 { margin-top: 36px; font-size: 1.15rem; }
    .muted { color: #667085; }
    .card { background: #fff; border: 1px solid #e3e6eb; border-radius: 8px; padding: 20px; }
    .error { background: #fdecea; border: 1px solid #f5c2c0; color: #8a1f17; padding: 12px; border-radius: 6px; margin: 16px 0; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    button, .button { background: #2f5597; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px;
                      font-size: 1rem; cursor: pointer; text-decoration: none; display: inline-block; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 20px 0; }
    .stat { background: #fff; border: 1px solid #e3e6eb; border-radius: 8px; padding: 16px; }
    .stat .number { font-size: 2rem; font-weight: 700; }
    .stat.ok .number { color: #1e7b34; }
    .stat.warn .number { color: #b45309; }
    .stat.bad .number { color: #b42318; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: #fff; font-size: 0.9rem; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e3e6eb; vertical-align: top; }
    th { background: #eef1f6; }
    td.amount { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .negative { color: #b42318; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; }
    .badge.Review { background: #fde7c7; color: #8a4b08; }
    .badge.Probable { background: #e0ecff; color: #1d4ed8; }
    .badge.Matched { background: #dcf3e2; color: #1e7b34; }
    details summary { cursor: pointer; font-weight: 600; font-size: 1.15rem; margin-top: 36px; }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
